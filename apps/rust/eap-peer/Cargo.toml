[package]
name = "sysu-netauth-eap-peer"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "sysu_netauth_eap_peer"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
netauth = { package = "sysu-netauth", path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_ExtensibleAuthenticationProtocol", "Win32_System_Com", "Win32_System_Memory", "Win32_UI_Shell"] }
